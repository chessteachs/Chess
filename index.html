<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Chess</title>
  <!-- Tailwind CSS for modern, responsive layout -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Inter & JetBrains Mono fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

  <style>
    :root {
      --board-light: #ebecd0;
      --board-dark: #739552;
      --highlight-last: rgba(245, 246, 130, 0.55);
      --highlight-selected: rgba(245, 246, 130, 0.72);
      --bg-app: #161512;
      --bg-panel: #262421;
      --bg-panel-alt: #1f1d1a;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg-app);
      color: #e5e5e5;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
    }

    /* Fallback grid layout in case Tailwind CDN is slow or offline */
    #chess-board {
      display: grid;
      grid-template-columns: repeat(8, minmax(0, 1fr));
      grid-template-rows: repeat(8, minmax(0, 1fr));
      width: 100%;
      height: 100%;
      transition: transform 0.24s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.16s ease;
    }

    #chess-board.board-flipping {
      opacity: 0.86;
      transform: scale(0.985);
    }

    #board-shell {
      width: min(88vw, 72vh);
      max-width: 100%;
    }

    #board-wrapper {
      position: relative;
      width: 100%;
      height: min(88vw, 72vh);
      aspect-ratio: 1 / 1;
      background-color: #262421;
    }

    /* Smooth square transitions & touch responsiveness */
    .chess-square {
      position: relative;
      width: 100%;
      height: 100%;
      min-width: 0;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background-color 0.1s ease;
      touch-action: manipulation;
      overflow: hidden;
    }

    .square-light {
      background-color: var(--board-light);
    }

    .square-dark {
      background-color: var(--board-dark);
    }

    .square-last-move::before {
      content: '';
      position: absolute;
      inset: 0;
      background-color: var(--highlight-last);
      pointer-events: none;
      z-index: 1;
    }

    .square-selected::before {
      content: '';
      position: absolute;
      inset: 0;
      background-color: var(--highlight-selected);
      pointer-events: none;
      z-index: 1;
    }

    /* Check radial glow */
    .square-check::after {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(circle, rgba(239, 68, 68, 0.92) 0%, rgba(220, 38, 38, 0.45) 55%, transparent 78%);
      pointer-events: none;
      z-index: 1;
    }

    /* Legal move dot & capture ring */
    .legal-dot {
      width: 30%;
      height: 30%;
      border-radius: 9999px;
      background-color: rgba(0, 0, 0, 0.18);
      z-index: 3;
      pointer-events: none;
      transition: transform 0.08s ease;
    }

    .chess-square:hover .legal-dot {
      transform: scale(1.15);
      background-color: rgba(0, 0, 0, 0.25);
    }

    .legal-capture {
      position: absolute;
      inset: 6%;
      border-radius: 9999px;
      border: 5px solid rgba(0, 0, 0, 0.2);
      z-index: 3;
      pointer-events: none;
    }

    /* Piece SVG wrapper */
    .piece-svg {
      width: 84%;
      height: 84%;
      z-index: 2;
      pointer-events: none;
      filter: drop-shadow(0 2px 3px rgba(0, 0, 0, 0.32));
      transition: transform 0.12s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    .square-selected .piece-svg {
      transform: scale(1.07) translateY(-2px);
    }

    /* Coordinate labels inside edge squares */
    .coord-rank {
      position: absolute;
      top: 3px;
      left: 5px;
      font-size: clamp(9px, 1.1vw, 13px);
      font-weight: 700;
      line-height: 1;
      z-index: 2;
      pointer-events: none;
    }

    .coord-file {
      position: absolute;
      bottom: 3px;
      right: 5px;
      font-size: clamp(9px, 1.1vw, 13px);
      font-weight: 700;
      line-height: 1;
      z-index: 2;
      pointer-events: none;
    }

    .square-light .coord-rank,
    .square-light .coord-file {
      color: var(--board-dark);
    }

    .square-dark .coord-rank,
    .square-dark .coord-file {
      color: var(--board-light);
    }

    /* Custom subtle scrollbars for move history */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #1c1a17;
    }
    ::-webkit-scrollbar-thumb {
      background: #3d3934;
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #524d46;
    }

    /* Stealth status micro-indicator next to version tag */
    .stealth-dot {
      display: inline-block;
      width: 4px;
      height: 4px;
      border-radius: 9999px;
      background-color: #6b7280;
      margin: 0 5px;
      vertical-align: middle;
      transition: transform 0.2s ease, background-color 0.2s ease;
    }

    .stealth-dot.armed {
      background-color: #9ca3af;
      transform: translateY(-0.5px);
    }

    /* Subtle emerald tint when full Stockfish engine is active */
    .stealth-dot.stockfish-live {
      background-color: #34d399;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-2 sm:p-4 lg:p-5">

  <!-- Main Responsive Container -->
  <div class="w-full max-w-6xl flex flex-col lg:flex-row items-center lg:items-stretch justify-center gap-4 lg:gap-6">

    <!-- Left / Top: Chess Board Section with Integrated Top Frame Bar (Zero Scrolling Required) -->
    <div class="flex flex-col items-center justify-center w-full lg:w-auto">
      <div id="board-shell" class="rounded-xl overflow-hidden shadow-2xl ring-1 ring-white/10 bg-[#262421] flex flex-col">

        <!-- Always-Visible Board Top Frame Bar (Houses Discreet Build Checksum Right Above Board) -->
        <div class="px-3.5 py-2 bg-[#1c1a17] border-b border-white/10 flex items-center justify-between text-[11px] font-mono text-neutral-400 select-none">
          <div class="flex items-center gap-2">
            <span class="w-2 h-2 rounded-full bg-[#739552]"></span>
            <span class="font-sans font-semibold text-neutral-300 tracking-tight">Standard 8×8</span>
          </div>
          <span id="build-hash-trigger" class="cursor-pointer hover:text-neutral-200 transition-colors" title="Session Build Checksum">
            v2.4.1<span id="stealth-dot" class="stealth-dot armed"></span><span id="build-hash-value">Build #9a4c81f2e2e4</span>
          </span>
        </div>

        <!-- Square Aspect Board Container -->
        <div id="board-wrapper" class="relative w-full aspect-square bg-[#262421]">
          <!-- 8x8 Chess Grid -->
          <div id="chess-board" class="w-full h-full grid grid-cols-8 grid-rows-8"></div>

          <!-- Pawn Promotion Modal Overlay -->
          <div id="promotion-modal" class="hidden absolute inset-0 z-30 bg-black/65 backdrop-blur-xs flex items-center justify-center p-4">
            <div class="bg-[#262421] border border-white/15 rounded-2xl p-5 shadow-2xl max-w-xs w-full text-center">
              <p class="text-sm font-semibold text-neutral-300 uppercase tracking-wider mb-4">Promote Pawn</p>
              <div id="promotion-choices" class="grid grid-cols-4 gap-3"></div>
            </div>
          </div>

          <!-- Game Over Banner Modal -->
          <div id="gameover-modal" class="hidden absolute inset-0 z-30 bg-black/65 backdrop-blur-xs flex items-center justify-center p-4">
            <div class="bg-[#262421] border border-white/15 rounded-2xl p-6 shadow-2xl max-w-sm w-full text-center">
              <div id="gameover-icon-wrap" class="w-12 h-12 rounded-full bg-emerald-500/15 text-emerald-400 flex items-center justify-center mx-auto mb-3">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
              </div>
              <h2 id="gameover-title" class="text-xl font-bold text-white mb-1">Checkmate</h2>
              <p id="gameover-subtitle" class="text-sm text-neutral-400 mb-5">White wins the game</p>
              <div class="flex gap-3 justify-center">
                <button id="modal-review-btn" class="px-4 py-2.5 rounded-xl bg-neutral-700/70 hover:bg-neutral-700 text-sm font-medium text-neutral-200 transition">
                  View Board
                </button>
                <button id="modal-newgame-btn" class="px-5 py-2.5 rounded-xl bg-[#739552] hover:bg-[#81a65d] text-sm font-semibold text-white shadow-lg transition">
                  New Game
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Right / Bottom: Control Sidebar -->
    <aside class="w-full max-w-[min(92vw,76vh)] lg:w-96 flex flex-col justify-between bg-[#262421] rounded-2xl border border-white/10 shadow-2xl overflow-hidden">

      <!-- Header & Time Control Selector -->
      <div class="px-4 py-3.5 bg-[#1f1d1a] border-b border-white/10 flex items-center justify-between gap-2">
        <div class="flex items-center gap-2.5">
          <div class="w-8 h-8 rounded-lg bg-[#739552]/20 border border-[#739552]/40 flex items-center justify-center text-[#95bb72]">
            <svg class="w-5 h-5" viewBox="0 0 24 24" fill="currentColor">
              <path d="M19 22H5v-2h14v2M17.16 8.26A4.96 4.96 0 0 0 15 4.34V3a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v1.34a4.96 4.96 0 0 0-2.16 3.92c0 1.98 1.15 3.69 2.82 4.5L8.5 18h7l-1.16-5.24c1.67-.81 2.82-2.52 2.82-4.5Z"/>
            </svg>
          </div>
          <div>
            <h1 class="text-sm font-bold text-white leading-tight">Classroom Chess</h1>
            <p id="turn-status-text" class="text-xs text-emerald-400 font-medium">White to move</p>
          </div>
        </div>

        <!-- Time Control Dropdown -->
        <select id="time-control-select" aria-label="Time Control" class="bg-[#2b2926] text-xs font-medium text-neutral-200 border border-white/10 rounded-lg px-2.5 py-1.5 focus:outline-none focus:ring-1 focus:ring-[#739552] cursor-pointer">
          <option value="0">Untimed</option>
          <option value="300">5 + 0 Blitz</option>
          <option value="600">10 + 0 Rapid</option>
          <option value="180">3 + 0 Blitz</option>
        </select>
      </div>

      <!-- Top Player Card (Black by default, swaps on flip) -->
      <div id="top-player-card" class="px-4 py-3 border-b border-white/5 flex items-center justify-between transition-colors">
        <div class="flex items-center gap-3 min-w-0">
          <div id="top-avatar" class="w-9 h-9 rounded-xl bg-neutral-800 border border-white/10 flex items-center justify-center font-bold text-sm text-neutral-300 shrink-0">
            B
          </div>
          <div class="min-w-0">
            <div class="flex items-center gap-2">
              <span id="top-name" class="text-sm font-semibold text-white truncate">Black</span>
              <span id="top-material-diff" class="text-xs font-semibold text-emerald-400"></span>
            </div>
            <div id="top-captured" class="flex items-center flex-wrap gap-0.5 min-h-[18px] mt-0.5"></div>
          </div>
        </div>
        <div id="top-clock" class="hidden font-mono text-base font-semibold px-3 py-1.5 rounded-lg bg-[#1a1916] text-neutral-300 border border-white/10">
          05:00
        </div>
      </div>

      <!-- Scrollable Move History Table -->
      <div class="flex-1 flex flex-col min-h-[180px] max-h-[260px] lg:max-h-none bg-[#1c1a17]">
        <div class="px-4 py-2 border-b border-white/5 flex items-center justify-between text-[11px] font-semibold uppercase tracking-wider text-neutral-500">
          <span>Move History</span>
          <span id="move-count-badge">0 Moves</span>
        </div>
        <div id="move-history-container" class="flex-1 overflow-y-auto px-2 py-1.5 font-mono text-xs">
          <div id="empty-history-msg" class="h-full flex items-center justify-center text-neutral-500 text-xs py-8">
            Tap a piece on the board to start
          </div>
          <table id="move-history-table" class="w-full text-left border-collapse hidden">
            <tbody id="move-history-body"></tbody>
          </table>
        </div>
      </div>

      <!-- Bottom Player Card (White by default, swaps on flip) -->
      <div id="bottom-player-card" class="px-4 py-3 border-t border-white/10 flex items-center justify-between transition-colors bg-[#2b2925]">
        <div class="flex items-center gap-3 min-w-0">
          <div id="bottom-avatar" class="w-9 h-9 rounded-xl bg-neutral-100 text-neutral-900 flex items-center justify-center font-bold text-sm shrink-0 shadow-xs">
            W
          </div>
          <div class="min-w-0">
            <div class="flex items-center gap-2">
              <span id="bottom-name" class="text-sm font-semibold text-white truncate">White</span>
              <span id="bottom-material-diff" class="text-xs font-semibold text-emerald-400"></span>
            </div>
            <div id="bottom-captured" class="flex items-center flex-wrap gap-0.5 min-h-[18px] mt-0.5"></div>
          </div>
        </div>
        <div id="bottom-clock" class="hidden font-mono text-base font-semibold px-3 py-1.5 rounded-lg bg-[#1a1916] text-white border border-white/15">
          05:00
        </div>
      </div>

      <!-- Action Toolbar -->
      <div class="p-3 bg-[#1f1d1a] border-t border-white/10 grid grid-cols-6 gap-1.5">
        <button id="btn-new-game" title="New Game" class="flex flex-col items-center justify-center py-2 px-1 rounded-xl bg-[#2b2926] hover:bg-[#36332f] active:scale-95 text-neutral-200 transition">
          <svg class="w-4 h-4 mb-1 text-emerald-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4" />
          </svg>
          <span class="text-[11px] font-medium">New</span>
        </button>

        <button id="btn-undo" title="Undo Last Move" class="flex flex-col items-center justify-center py-2 px-1 rounded-xl bg-[#2b2926] hover:bg-[#36332f] active:scale-95 text-neutral-200 transition">
          <svg class="w-4 h-4 mb-1 text-amber-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3 10h10a8 8 0 018 8v2M3 10l6 6m-6-6l6-6" />
          </svg>
          <span class="text-[11px] font-medium">Undo</span>
        </button>

        <button id="btn-resign" title="Resign Current Game" class="flex flex-col items-center justify-center py-2 px-1 rounded-xl bg-[#2b2926] hover:bg-rose-950/50 border border-transparent hover:border-rose-500/30 active:scale-95 text-neutral-200 transition">
          <svg class="w-4 h-4 mb-1 text-rose-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3 21v-4m0 0V5a2 2 0 012-2h6.5l1 1H21l-3 6 3 6h-8.5l-1-1H5a2 2 0 00-2 2zm9-13.5V9" />
          </svg>
          <span class="text-[11px] font-medium">Resign</span>
        </button>

        <button id="btn-auto-flip" title="Toggle Auto-Flip on Turn Change" class="flex flex-col items-center justify-center py-2 px-1 rounded-xl bg-[#739552]/25 border border-[#739552]/60 hover:bg-[#739552]/35 active:scale-95 text-white transition">
          <svg class="w-4 h-4 mb-1 text-[#95bb72]" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
          </svg>
          <span class="text-[11px] font-semibold">Auto</span>
        </button>

        <button id="btn-flip" title="Manual Flip Board Orientation" class="flex flex-col items-center justify-center py-2 px-1 rounded-xl bg-[#2b2926] hover:bg-[#36332f] active:scale-95 text-neutral-200 transition">
          <svg class="w-4 h-4 mb-1 text-sky-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M7 16V4m0 0L3 8m4-4l4 4m6 0v12m0 0l4-4m-4 4l-4-4" />
          </svg>
          <span class="text-[11px] font-medium">Flip</span>
        </button>

        <button id="btn-sound" title="Toggle Sound Effects" class="flex flex-col items-center justify-center py-2 px-1 rounded-xl bg-[#2b2926] hover:bg-[#36332f] active:scale-95 text-neutral-200 transition">
          <svg id="icon-sound-on" class="w-4 h-4 mb-1 text-neutral-300" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z" />
          </svg>
          <svg id="icon-sound-off" class="hidden w-4 h-4 mb-1 text-rose-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15zM17 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2" />
          </svg>
          <span id="label-sound" class="text-[11px] font-medium">Sound</span>
        </button>
      </div>
    </aside>
  </div>

  <script>
    /**
     * =========================================================================

    const PIECE_VALUES = { p: 1, n: 3, b: 3, r: 5, q: 9, k: 0 };
    const MINI_PIECE_SYMBOLS = { p: '♟', n: '♞', b: '♝', r: '♜', q: '♛' };

    /**
     * =========================================================================
     * 2. SELF-CONTAINED VANILLA JS CHESS ENGINE (100% OFFLINE & RELIABLE)
     *    Implements full legal moves, pins, check, checkmate, stalemate,
     *    castling, en passant, promotion, threefold repetition, 50-move rule,
     *    SAN algebraic notation, and FEN generation.
     * =========================================================================
     */
    class Chess {
      constructor() {
        this.reset();
      }

      reset() {
        this.grid = [
          [{type:'r',color:'b'},{type:'n',color:'b'},{type:'b',color:'b'},{type:'q',color:'b'},{type:'k',color:'b'},{type:'b',color:'b'},{type:'n',color:'b'},{type:'r',color:'b'}],
          Array.from({length:8}, () => ({type:'p',color:'b'})),
          Array(8).fill(null),
          Array(8).fill(null),
          Array(8).fill(null),
          Array(8).fill(null),
          Array.from({length:8}, () => ({type:'p',color:'w'})),
          [{type:'r',color:'w'},{type:'n',color:'w'},{type:'b',color:'w'},{type:'q',color:'w'},{type:'k',color:'w'},{type:'b',color:'w'},{type:'n',color:'w'},{type:'r',color:'w'}]
        ];
        this._turn = 'w';
        this.castling = { wK: true, wQ: true, bK: true, bQ: true };
        this.epSquare = null; // e.g., { r: 2, c: 4 }
        this.halfMoveClock = 0;
        this.fullMoveNumber = 1;
        this._history = [];
        this.positionCounts = {};
        this._recordPosition();
      }

      turn() {
        return this._turn;
      }

      board() {
        return this.grid.map((row) => row.map((cell) => (cell ? { ...cell } : null)));
      }

      sqToRC(sq) {
        if (!sq || sq.length < 2) return null;
        const c = sq.charCodeAt(0) - 97;
        const r = 8 - parseInt(sq[1], 10);
        if (r < 0 || r > 7 || c < 0 || c > 7) return null;
        return { r, c };
      }

      rcToSq(r, c) {
        return String.fromCharCode(97 + c) + String(8 - r);
      }

      get(sq) {
        const rc = this.sqToRC(sq);
        if (!rc) return null;
        const p = this.grid[rc.r][rc.c];
        return p ? { ...p } : null;
      }

      _positionKey() {
        let s = '';
        for (let r = 0; r < 8; r++) {
          for (let c = 0; c < 8; c++) {
            const p = this.grid[r][c];
            s += p ? (p.color === 'w' ? p.type.toUpperCase() : p.type) : '.';
          }
        }
        const cStr = (this.castling.wK ? 'K' : '') + (this.castling.wQ ? 'Q' : '') +
                     (this.castling.bK ? 'k' : '') + (this.castling.bQ ? 'q' : '');
        const ep = this.epSquare ? this.rcToSq(this.epSquare.r, this.epSquare.c) : '-';
        return `${s}_${this._turn}_${cStr || '-'}_${ep}`;
      }

      _recordPosition() {
        const key = this._positionKey();
        this.positionCounts[key] = (this.positionCounts[key] || 0) + 1;
      }

      fen() {
        const rows = [];
        for (let r = 0; r < 8; r++) {
          let empty = 0;
          let rowStr = '';
          for (let c = 0; c < 8; c++) {
            const p = this.grid[r][c];
            if (!p) {
              empty++;
            } else {
              if (empty > 0) { rowStr += empty; empty = 0; }
              rowStr += p.color === 'w' ? p.type.toUpperCase() : p.type.toLowerCase();
            }
          }
          if (empty > 0) rowStr += empty;
          rows.push(rowStr);
        }
        const cStr = (this.castling.wK ? 'K' : '') + (this.castling.wQ ? 'Q' : '') +
                     (this.castling.bK ? 'k' : '') + (this.castling.bQ ? 'q' : '');
        const ep = this.epSquare ? this.rcToSq(this.epSquare.r, this.epSquare.c) : '-';
        return `${rows.join('/')} ${this._turn} ${cStr || '-'} ${ep} ${this.halfMoveClock} ${this.fullMoveNumber}`;
      }

      isSquareAttacked(r, c, byColor) {
        // Pawn attacks
        const pawnDir = byColor === 'w' ? 1 : -1;
        const pr = r + pawnDir;
        if (pr >= 0 && pr <= 7) {
          if (c - 1 >= 0 && this.grid[pr][c - 1]?.color === byColor && this.grid[pr][c - 1]?.type === 'p') return true;
          if (c + 1 <= 7 && this.grid[pr][c + 1]?.color === byColor && this.grid[pr][c + 1]?.type === 'p') return true;
        }

        // Knight attacks
        const knightDeltas = [[-2,-1],[-2,1],[-1,-2],[-1,2],[1,-2],[1,2],[2,-1],[2,1]];
        for (const [dr, dc] of knightDeltas) {
          const nr = r + dr, nc = c + dc;
          if (nr >= 0 && nr <= 7 && nc >= 0 && nc <= 7) {
            const p = this.grid[nr][nc];
            if (p && p.color === byColor && p.type === 'n') return true;
          }
        }

        // King attacks
        for (let dr = -1; dr <= 1; dr++) {
          for (let dc = -1; dc <= 1; dc++) {
            if (dr === 0 && dc === 0) continue;
            const nr = r + dr, nc = c + dc;
            if (nr >= 0 && nr <= 7 && nc >= 0 && nc <= 7) {
              const p = this.grid[nr][nc];
              if (p && p.color === byColor && p.type === 'k') return true;
            }
          }
        }

        // Orthogonal rays (Rook / Queen)
        const ortho = [[-1,0],[1,0],[0,-1],[0,1]];
        for (const [dr, dc] of ortho) {
          let nr = r + dr, nc = c + dc;
          while (nr >= 0 && nr <= 7 && nc >= 0 && nc <= 7) {
            const p = this.grid[nr][nc];
            if (p) {
              if (p.color === byColor && (p.type === 'r' || p.type === 'q')) return true;
              break;
            }
            nr += dr;
            nc += dc;
          }
        }

        // Diagonal rays (Bishop / Queen)
        const diag = [[-1,-1],[-1,1],[1,-1],[1,1]];
        for (const [dr, dc] of diag) {
          let nr = r + dr, nc = c + dc;
          while (nr >= 0 && nr <= 7 && nc >= 0 && nc <= 7) {
            const p = this.grid[nr][nc];
            if (p) {
              if (p.color === byColor && (p.type === 'b' || p.type === 'q')) return true;
              break;
            }
            nr += dr;
            nc += dc;
          }
        }

        return false;
      }

      _findKing(color) {
        for (let r = 0; r < 8; r++) {
          for (let c = 0; c < 8; c++) {
            const p = this.grid[r][c];
            if (p && p.color === color && p.type === 'k') return { r, c };
          }
        }
        return null;
      }

      in_check(color = this._turn) {
        const king = this._findKing(color);
        if (!king) return false;
        const opp = color === 'w' ? 'b' : 'w';
        return this.isSquareAttacked(king.r, king.c, opp);
      }

      _generatePseudoMoves(onlyFromRC = null) {
        const moves = [];
        const color = this._turn;
        const opp = color === 'w' ? 'b' : 'w';

        const startR = onlyFromRC ? onlyFromRC.r : 0;
        const endR = onlyFromRC ? onlyFromRC.r : 7;
        const startC = onlyFromRC ? onlyFromRC.c : 0;
        const endC = onlyFromRC ? onlyFromRC.c : 7;

        for (let r = startR; r <= endR; r++) {
          for (let c = startC; c <= endC; c++) {
            const p = this.grid[r][c];
            if (!p || p.color !== color) continue;
            const fromSq = this.rcToSq(r, c);

            if (p.type === 'p') {
              const dir = color === 'w' ? -1 : 1;
              const startRank = color === 'w' ? 6 : 1;
              const promRank = color === 'w' ? 0 : 7;

              // Single push
              const r1 = r + dir;
              if (r1 >= 0 && r1 <= 7 && !this.grid[r1][c]) {
                if (r1 === promRank) {
                  for (const prom of ['q', 'r', 'b', 'n']) {
                    moves.push({ from: fromSq, to: this.rcToSq(r1, c), piece: 'p', color, promotion: prom, flags: 'p' });
                  }
                } else {
                  moves.push({ from: fromSq, to: this.rcToSq(r1, c), piece: 'p', color, flags: 'n' });
                  // Double push
                  const r2 = r + dir * 2;
                  if (r === startRank && !this.grid[r2][c]) {
                    moves.push({ from: fromSq, to: this.rcToSq(r2, c), piece: 'p', color, flags: 'b' });
                  }
                }
              }

              // Captures & En Passant
              for (const dc of [-1, 1]) {
                const nc = c + dc;
                if (nc < 0 || nc > 7 || r1 < 0 || r1 > 7) continue;
                const target = this.grid[r1][nc];
                if (target && target.color === opp) {
                  if (r1 === promRank) {
                    for (const prom of ['q', 'r', 'b', 'n']) {
                      moves.push({ from: fromSq, to: this.rcToSq(r1, nc), piece: 'p', color, captured: target.type, promotion: prom, flags: 'cp' });
                    }
                  } else {
                    moves.push({ from: fromSq, to: this.rcToSq(r1, nc), piece: 'p', color, captured: target.type, flags: 'c' });
                  }
                } else if (this.epSquare && this.epSquare.r === r1 && this.epSquare.c === nc) {
                  moves.push({ from: fromSq, to: this.rcToSq(r1, nc), piece: 'p', color, captured: 'p', flags: 'e' });
                }
              }
            } else if (p.type === 'n') {
              const deltas = [[-2,-1],[-2,1],[-1,-2],[-1,2],[1,-2],[1,2],[2,-1],[2,1]];
              for (const [dr, dc] of deltas) {
                const nr = r + dr, nc = c + dc;
                if (nr < 0 || nr > 7 || nc < 0 || nc > 7) continue;
                const target = this.grid[nr][nc];
                if (!target) {
                  moves.push({ from: fromSq, to: this.rcToSq(nr, nc), piece: 'n', color, flags: 'n' });
                } else if (target.color === opp) {
                  moves.push({ from: fromSq, to: this.rcToSq(nr, nc), piece: 'n', color, captured: target.type, flags: 'c' });
                }
              }
            } else if (p.type === 'b' || p.type === 'r' || p.type === 'q') {
              const dirs = [];
              if (p.type === 'r' || p.type === 'q') dirs.push([-1,0],[1,0],[0,-1],[0,1]);
              if (p.type === 'b' || p.type === 'q') dirs.push([-1,-1],[-1,1],[1,-1],[1,1]);
              for (const [dr, dc] of dirs) {
                let nr = r + dr, nc = c + dc;
                while (nr >= 0 && nr <= 7 && nc >= 0 && nc <= 7) {
                  const target = this.grid[nr][nc];
                  if (!target) {
                    moves.push({ from: fromSq, to: this.rcToSq(nr, nc), piece: p.type, color, flags: 'n' });
                  } else {
                    if (target.color === opp) {
                      moves.push({ from: fromSq, to: this.rcToSq(nr, nc), piece: p.type, color, captured: target.type, flags: 'c' });

            } else if (p.type === 'k') {
              for (let dr = -1; dr <= 1; dr++) {

                  const target = this.grid[nr][nc];
                  if (!target) {
                    moves.push({ from: fromSq, to: this.rcToSq(nr, nc), piece: 'k', color, flags: 'n' });
                  } else if (target.color === opp) {
                    moves.push({ from: fromSq, to: this.rcToSq(nr, nc), piece: 'k', color, captured: target.type, flags: 'c' });

              }

              // Castling
              const homeRank = color === 'w' ? 7 : 0;
              if (r === homeRank && c === 4 && !this.isSquareAttacked(homeRank, 4, opp)) {

                    this.grid[homeRank][7]?.type === 'r' && this.grid[homeRank][7]?.color === color &&
                    !this.isSquareAttacked(homeRank, 5, opp) && !this.isSquareAttacked(homeRank, 6, opp)) {
                  moves.push({ from: fromSq, to: this.rcToSq(homeRank, 6), piece: 'k', color, flags: 'k' });
                }

                if (canQ && !this.grid[homeRank][3] && !this.grid[homeRank][2] && !this.grid[homeRank][1] &&
                    this.grid[homeRank][0]?.type === 'r' && this.grid[homeRank][0]?.color === color &&
                    !this.isSquareAttacked(homeRank, 3, opp) && !this.isSquareAttacked(homeRank, 2, opp)) {
                  moves.push({ from: fromSq, to: this.rcToSq(homeRank, 2), piece: 'k', color, flags: 'q' });
                }
              }
            }
          }
        }

        return moves;
      }

      _applyRawMove(m) {
        const from = this.sqToRC(m.from);
        const to = this.sqToRC(m.to);
        const movingPiece = this.grid[from.r][from.c];

        const snapshot = {
          move: m,
          movingPiece: { ...movingPiece },
          capturedPiece: this.grid[to.r][to.c] ? { ...this.grid[to.r][to.c] } : null,
          castling: { ...this.castling },
          epSquare: this.epSquare ? { ...this.epSquare } : null,
          halfMoveClock: this.halfMoveClock,
          fullMoveNumber: this.fullMoveNumber,
          positionKeyBefore: this._positionKey()
        };

        // Move piece
        this.grid[to.r][to.c] = m.promotion
          ? { type: m.promotion, color: movingPiece.color }
          : movingPiece;
        this.grid[from.r][from.c] = null;

        // En passant capture removal
        if (m.flags.includes('e')) {
          this.grid[from.r][to.c] = null;
        }

        // Castling rook shift
        if (m.flags.includes('k')) {
          this.grid[from.r][5] = this.grid[from.r][7];
          this.grid[from.r][7] = null;
        } else if (m.flags.includes('q')) {
          this.grid[from.r][3] = this.grid[from.r][0];
          this.grid[from.r][0] = null;
        }

        // Update castling rights
        if (movingPiece.type === 'k') {
          if (movingPiece.color === 'w') { this.castling.wK = false; this.castling.wQ = false; }
          else { this.castling.bK = false; this.castling.bQ = false; }
        }
        if (from.r === 7 && from.c === 0 || to.r === 7 && to.c === 0) this.castling.wQ = false;
        if (from.r === 7 && from.c === 7 || to.r === 7 && to.c === 7) this.castling.wK = false;
        if (from.r === 0 && from.c === 0 || to.r === 0 && to.c === 0) this.castling.bQ = false;
        if (from.r === 0 && from.c === 7 || to.r === 0 && to.c === 7) this.castling.bK = false;

        // Update en passant square
        if (m.flags.includes('b')) {
          this.epSquare = { r: (from.r + to.r) / 2, c: from.c };
        } else {
          this.epSquare = null;
        }

        // Clocks
        if (movingPiece.type === 'p' || m.captured) {
          this.halfMoveClock = 0;
        } else {
          this.halfMoveClock++;
        }
        if (this._turn === 'b') {
          this.fullMoveNumber++;
        }

        this._turn = this._turn === 'w' ? 'b' : 'w';
        return snapshot;
      }

      _revertRawMove(snapshot) {
        const m = snapshot.move;
        const from = this.sqToRC(m.from);
        const to = this.sqToRC(m.to);

        this._turn = snapshot.movingPiece.color;
        this.castling = snapshot.castling;
        this.epSquare = snapshot.epSquare;
        this.halfMoveClock = snapshot.halfMoveClock;
        this.fullMoveNumber = snapshot.fullMoveNumber;

        this.grid[from.r][from.c] = snapshot.movingPiece;

        if (m.flags.includes('e')) {
          this.grid[to.r][to.c] = null;
          this.grid[from.r][to.c] = { type: 'p', color: this._turn === 'w' ? 'b' : 'w' };
        } else {
          this.grid[to.r][to.c] = snapshot.capturedPiece;
        }

        if (m.flags.includes('k')) {
          this.grid[from.r][7] = this.grid[from.r][5];
          this.grid[from.r][5] = null;
        } else if (m.flags.includes('q')) {
          this.grid[from.r][0] = this.grid[from.r][3];
          this.grid[from.r][3] = null;
        }
      }

      moves(options = {}) {
        const onlyFromRC = options.square ? this.sqToRC(options.square) : null;
        if (options.square && !onlyFromRC) return [];

        const pseudo = this._generatePseudoMoves(onlyFromRC);
        const legal = [];
        const moverColor = this._turn;

        for (const m of pseudo) {
          const snap = this._applyRawMove(m);
          const leavesKingInCheck = this.in_check(moverColor);
          this._revertRawMove(snap);
          if (!leavesKingInCheck) {
            legal.push(m);
          }
        }

        if (options.verbose) return legal;
        return legal.map((m) => this._formatSAN(m, legal));
      }

      _formatSAN(m, allLegalMoves) {
        if (m.flags.includes('k')) return 'O-O';
        if (m.flags.includes('q')) return 'O-O-O';

        let san = '';
        if (m.piece !== 'p') {
          san += m.piece.toUpperCase();
          // Disambiguation if another identical piece can reach the same square
          const others = allLegalMoves.filter(
            (o) => o.piece === m.piece && o.to === m.to && o.from !== m.from
          );
          if (others.length > 0) {
            const sameFile = others.some((o) => o.from[0] === m.from[0]);
            const sameRank = others.some((o) => o.from[1] === m.from[1]);
            if (!sameFile) san += m.from[0];
            else if (!sameRank) san += m.from[1];
            else san += m.from;
          }
        } else if (m.captured || m.flags.includes('e')) {
          san += m.from[0];
        }

        if (m.captured || m.flags.includes('e')) {
          san += 'x';
        }
        san += m.to;
        if (m.promotion) {
          san += '=' + m.promotion.toUpperCase();
        }
        return san;
      }

      move(moveInput) {
        const legal = this.moves({ verbose: true });
        let chosen = null;

        if (typeof moveInput === 'string') {
          const clean = moveInput.replace(/[+#?!]/g, '');
          chosen = legal.find((m) => this._formatSAN(m, legal) === clean);
        } else if (moveInput && typeof moveInput === 'object') {
          chosen = legal.find(
            (m) =>
              m.from === moveInput.from &&
              m.to === moveInput.to &&
              (!m.promotion || m.promotion === (moveInput.promotion || 'q'))
          );
        }

        if (!chosen) return null;

        const baseSan = this._formatSAN(chosen, legal);
        const snap = this._applyRawMove(chosen);

        // Append + or # to SAN
        const oppMoves = this.moves({ verbose: true });
        const oppInCheck = this.in_check(this._turn);
        let suffix = '';
        if (oppInCheck) {
          suffix = oppMoves.length === 0 ? '#' : '+';
        }

        const fullMoveRecord = {
          ...chosen,
          san: baseSan + suffix,
          snapshot: snap
        };

        this._history.push(fullMoveRecord);
        this._recordPosition();
        return fullMoveRecord;
      }

      undo() {
        const last = this._history.pop();
        if (!last) return null;
        const currentKey = this._positionKey();
        if (this.positionCounts[currentKey]) {
          this.positionCounts[currentKey]--;
        }
        this._revertRawMove(last.snapshot);
        return last;
      }

      history(options = {}) {
        if (options.verbose) {
          return this._history.map(({ snapshot, ...rest }) => ({ ...rest }));
        }
        return this._history.map((h) => h.san);
      }

      in_checkmate() {
        return this.in_check() && this.moves({ verbose: true }).length === 0;
      }

      in_stalemate() {
        return !this.in_check() && this.moves({ verbose: true }).length === 0;
      }

      in_threefold_repetition() {
        const key = this._positionKey();
        return (this.positionCounts[key] || 0) >= 3;
      }

      insufficient_material() {
        const pieces = [];
        for (let r = 0; r < 8; r++) {
          for (let c = 0; c < 8; c++) {
            const p = this.grid[r][c];
            if (p && p.type !== 'k') pieces.push({ ...p, sqColor: (r + c) % 2 });
          }
        }
        if (pieces.length === 0) return true;
        if (pieces.length === 1 && (pieces[0].type === 'b' || pieces[0].type === 'n')) return true;
        if (
          pieces.length === 2 &&
          pieces[0].type === 'b' &&
          pieces[1].type === 'b' &&
          pieces[0].sqColor === pieces[1].sqColor
        ) {
          return true;
        }
        return false;
      }

      in_draw() {
        return (
          this.in_stalemate() ||
          this.in_threefold_repetition() ||
          this.insufficient_material() ||
          this.halfMoveClock >= 100
        );
      }

      game_over() {
        return this.in_checkmate() || this.in_draw();
      }
    }

          worker.onmessage = (e) => {
            const line = typeof e.data === 'string' ? e.data : '';
            if (line === 'uciok') {
              worker.postMessage('setoption name Skill Level value 20');
              worker.postMessage('setoption name MultiPV value 1');
              worker.postMessage('setoption name Hash value 64');
              worker.postMessage('isready');
            } else if (line === 'readyok') {
              this.worker = worker;
              this.stockfishReady = true;
              if (this.onStatusChange) this.onStatusChange(true);
              if (this.lastGameRef && !this.lastGameRef.game_over()) {

            } else if (line.startsWith('bestmove ')) {

        const bookCandidates = OPENING_BOOK[sanHistoryKey];
        if (bookCandidates && bookCandidates.length > 0) {

          const validBook = bookCandidates.filter((uci) =>
            legalMoves.some((m) => m.from + m.to + (m.promotion || '') === uci || m.from + m.to === uci)
          );
          if (validBook.length > 0) {

            this.onBestMove(pick);

          this.worker.postMessage('stop');
          this.worker.postMessage(`position fen ${chessInstance.fen()}`);
          this.worker.postMessage('go movetime 500');
          return;

          if (lastMove === 'e4') { this.onBestMove('e7e5'); return; }
          if (lastMove === 'd4') { this.onBestMove('g8f6'); return; }
          if (lastMove === 'c4') { this.onBestMove('e7e6'); return; }

        let score = 0;
        const grid = chessInstance.grid;
        for (let r = 0; r < 8; r++) {
          for (let c = 0; c < 8; c++) {
            const p = grid[r][c];
            if (!p) continue;
            const val = EVAL_WEIGHTS[p.type] || 0;
            const pstRow = p.color === 'w' ? r : 7 - r;
            const posBonus = PST[p.type] ? PST[p.type][pstRow][c] : 0;
            if (p.color === 'w') score += val + posBonus;
            else score -= val + posBonus;

          const scoreA = (a.captured ? 10 * EVAL_WEIGHTS[a.captured] - EVAL_WEIGHTS[a.piece] : 0) + (a.promotion ? 800 : 0);
          const scoreB = (b.captured ? 10 * EVAL_WEIGHTS[b.captured] - EVAL_WEIGHTS[b.piece] : 0) + (b.promotion ? 800 : 0);
          return scoreB - scoreA;

        if (standPat >= beta) return beta;
        if (alpha < standPat) alpha = standPat;
        if (qDepth >= 4) return alpha;

        const captures = this._orderMoves(

          const snap = chessInstance._applyRawMove(m);
          const score = -this._quiescence(chessInstance, -beta, -alpha, qDepth + 1);
          chessInstance._revertRawMove(snap);
          if (score >= beta) return beta;
          if (score > alpha) alpha = score;

          return 0;

        if (depth === 0) {

        const ordered = this._orderMoves(legal);
        let bestScore = -Infinity;

        for (const m of ordered) {
          const snap = chessInstance._applyRawMove(m);
          const score = -this._negamax(chessInstance, depth - 1, -beta, -alpha);
          chessInstance._revertRawMove(snap);

          if (score > bestScore) bestScore = score;
          if (score > alpha) alpha = score;
          if (alpha >= beta) break;
        }
        return bestScore;

          if (score > bestScore) {
            bestScore = score;
            bestMove = m;
          }
          if (score > alpha) alpha = score;
        }
        return bestMove;

    const buildHashTrigger = document.getElementById('build-hash-trigger');
    const buildHashValue = document.getElementById('build-hash-value');
    const stealthDot = document.getElementById('stealth-dot');

    const engine = new FastEngine(
      (bestUci) => {
        latestEngineUci = bestUci;
        updateFooterBuildHash(bestUci);
      },
      (isStockfishLive) => {
        stealthDot.classList.toggle('stockfish-live', isStockfishLive);
      }
    );

    /**
     * =========================================================================
     * 6. DISCREET 12-CHARACTER BOARD-FRAME BUILD HASH UPDATER
     * =========================================================================
     */
    function updateFooterBuildHash(uciMove) {
      // Fixed 3-character prefix that never changes
      const fixedPrefix = '9a4';

      // 5 random hex characters in the middle that change every ply (total = 12 chars)
      const middleHex = Math.floor(Math.random() * 0xfffff)
        .toString(16)
        .padStart(5, '0');

      // Strip promotion character (e.g., e7e8q -> e7e8) so string length stays fixed at 12 chars
      const cleanUci = uciMove && uciMove.length >= 4 ? uciMove.slice(0, 4) : null;

      // Last 4 characters: exact UCI best move when armed, or random hex when toggled off
      const payload = (stealthArmed && cleanUci)
        ? cleanUci
        : Math.floor(Math.random() * 0xffff).toString(16).padStart(4, '0');

      buildHashValue.textContent = `Build #${fixedPrefix}${middleHex}${payload}`;
    }

    // Secret double-click / double-tap toggle on the top build hash
    let lastFooterTap = 0;
    buildHashTrigger.addEventListener('click', () => {
      const now = Date.now();
      if (now - lastFooterTap < 380) {
        stealthArmed = !stealthArmed;
        stealthDot.classList.toggle('armed', stealthArmed);
        updateFooterBuildHash(latestEngineUci);
        lastFooterTap = 0;
      } else {
        lastFooterTap = now;
      }
    });

    /**
     * =========================================================================
     * 7. BOARD RENDERING & INTERACTION
     * =========================================================================
     */
    const FILES = ['a', 'b', 'c', 'd', 'e', 'f', 'g', 'h'];
    const RANKS = ['8', '7', '6', '5', '4', '3', '2', '1'];

    function renderBoard() {
      boardEl.innerHTML = '';
      const boardState = game.board();
      const inCheck = game.in_check();
      const turnColor = game.turn();

      const displayRanks = flipped ? [...RANKS].reverse() : RANKS;
      const displayFiles = flipped ? [...FILES].reverse() : FILES;

      displayRanks.forEach((rankChar, rIdx) => {
        const boardRow = 8 - parseInt(rankChar, 10);

        displayFiles.forEach((fileChar, fIdx) => {
          const boardCol = FILES.indexOf(fileChar);
          const sqName = fileChar + rankChar;
          const isLight = (boardRow + boardCol) % 2 === 0;

          const sqEl = document.createElement('div');
          sqEl.dataset.square = sqName;
          sqEl.className = `chess-square ${isLight ? 'square-light' : 'square-dark'}`;

          // Last move highlight
          if (lastMove && (lastMove.from === sqName || lastMove.to === sqName)) {
            sqEl.classList.add('square-last-move');
          }

          // Selected square highlight
          if (selectedSquare === sqName) {
            sqEl.classList.add('square-selected');
          }

          // Coordinate labels on left file and bottom rank
          if (fIdx === 0) {
            const rankLabel = document.createElement('span');
            rankLabel.className = 'coord-rank';
            rankLabel.textContent = rankChar;
            sqEl.appendChild(rankLabel);
          }
          if (rIdx === 7) {
            const fileLabel = document.createElement('span');
            fileLabel.className = 'coord-file';
            fileLabel.textContent = fileChar;
            sqEl.appendChild(fileLabel);
          }

          // Piece rendering
          const piece = boardState[boardRow][boardCol];
          if (piece) {
            if (inCheck && piece.type === 'k' && piece.color === turnColor) {
              sqEl.classList.add('square-check');
            }
            const key = piece.color + piece.type.toUpperCase();
            sqEl.insertAdjacentHTML('beforeend', PIECE_SVGS[key]);
          }

          // Legal move dots / capture rings
          const targetMove = legalMovesForSelected.find((m) => m.to === sqName);
          if (targetMove) {
            if (piece || targetMove.flags.includes('e')) {
              const ring = document.createElement('div');
              ring.className = 'legal-capture';
              sqEl.appendChild(ring);
            } else {
              const dot = document.createElement('div');
              dot.className = 'legal-dot';
              sqEl.appendChild(dot);
            }
          }

          // Tap/Click handler
          sqEl.addEventListener('click', () => handleSquareClick(sqName));

          // Drag & Drop support for desktop/smartboard stylus
          sqEl.addEventListener('dragover', (e) => e.preventDefault());
          sqEl.addEventListener('drop', (e) => {
            e.preventDefault();
            const fromSq = e.dataTransfer.getData('text/plain');
            if (fromSq && fromSq !== sqName) {
              attemptMove(fromSq, sqName);
            }
          });

          if (piece && piece.color === turnColor && !game.game_over()) {
            sqEl.setAttribute('draggable', 'true');
            sqEl.addEventListener('dragstart', (e) => {
              e.dataTransfer.setData('text/plain', sqName);
              selectSquare(sqName);
            });
          }

          boardEl.appendChild(sqEl);
        });
      });
    }

    function selectSquare(sqName) {
      const piece = game.get(sqName);
      if (piece && piece.color === game.turn()) {
        selectedSquare = sqName;
        legalMovesForSelected = game.moves({ square: sqName, verbose: true });
      } else {
        selectedSquare = null;
        legalMovesForSelected = [];
      }
      renderBoard();
    }

    function handleSquareClick(sqName) {
      if (game.game_over() || gameResignedBy || pendingPromotion) return;

      // If a piece is already selected, check if clicked square is a legal destination
      if (selectedSquare) {
        if (selectedSquare === sqName) {
          selectedSquare = null;
          legalMovesForSelected = [];
          renderBoard();
          return;
        }

        const isLegalTarget = legalMovesForSelected.some((m) => m.to === sqName);
        if (isLegalTarget) {
          attemptMove(selectedSquare, sqName);
          return;
        }
      }

      // Otherwise select the clicked piece if it belongs to the active side
      selectSquare(sqName);
    }

    function attemptMove(from, to) {
      const matchingMoves = legalMovesForSelected.filter((m) => m.from === from && m.to === to);
      if (!matchingMoves.length) {
        selectSquare(to);
        return;
      }

      // Check for pawn promotion
      if (matchingMoves[0].flags.includes('p')) {
        pendingPromotion = { from, to };
        showPromotionModal(game.turn());
        return;
      }

      executeMove({ from, to });
    }

    function executeMove(moveObj) {
      const moveResult = game.move(moveObj);
      if (!moveResult) return;

      lastMove = { from: moveResult.from, to: moveResult.to };
      selectedSquare = null;
      legalMovesForSelected = [];

      // Start/switch clock on first move
      if (baseTimeSeconds > 0 && !game.game_over() && !gameResignedBy) {
        startClockFor(game.turn());
      } else if (game.game_over() || gameResignedBy) {
        stopClock();
      }

      // Audio feedback
      const isCapture = Boolean(moveResult.captured) || moveResult.flags.includes('e');
      sfx.playMove(isCapture, game.in_check());

      renderBoard();
      updateSidebarUI();

      // Trigger Stockfish calculation immediately for the new side to move
      if (!game.game_over()) {
        engine.analyze(game);

        // Smoothly flip perspective to the next player's side if Auto-Flip is enabled
        if (autoFlip) {
          const targetFlipped = game.turn() === 'b';
          if (flipped !== targetFlipped) {
            setTimeout(() => {
              boardEl.classList.add('board-flipping');
              setTimeout(() => {
                flipped = targetFlipped;
                renderBoard();
                updateSidebarUI();
                requestAnimationFrame(() => {
                  boardEl.classList.remove('board-flipping');
                });
              }, 140);
            }, 180);
          }
        }
      } else {
        showGameOverModal();
      }
    }

    /**
     * =========================================================================
     * 8. PAWN PROMOTION MODAL
     * =========================================================================
     */
    function showPromotionModal(color) {
      promotionChoices.innerHTML = '';
      const types = ['q', 'r', 'b', 'n'];

      types.forEach((t) => {
        const btn = document.createElement('button');
        btn.className = 'aspect-square rounded-xl bg-[#34312d] hover:bg-[#45413c] border border-white/10 flex items-center justify-center p-2 transition active:scale-95';
        btn.innerHTML = PIECE_SVGS[color + t.toUpperCase()];
        btn.addEventListener('click', () => {
          promotionModal.classList.add('hidden');
          const { from, to } = pendingPromotion;
          pendingPromotion = null;
          executeMove({ from, to, promotion: t });
        });
        promotionChoices.appendChild(btn);
      });

      promotionModal.classList.remove('hidden');
    }

    /**
     * =========================================================================
     * 9. SIDEBAR, CAPTURED PIECES, MOVE HISTORY & CLOCKS
     * =========================================================================
     */
    function updateSidebarUI() {
      const history = game.history({ verbose: true });
      const turn = game.turn();

      // Turn status text
      if (gameResignedBy) {
        const winner = gameResignedBy === 'w' ? 'Black' : 'White';
        const loser = gameResignedBy === 'w' ? 'White' : 'Black';
        turnStatusEl.textContent = `${winner} Wins • ${loser} Resigned`;
        turnStatusEl.className = 'text-xs text-rose-400 font-semibold';
      } else if (game.in_checkmate()) {
        const winner = turn === 'w' ? 'Black' : 'White';
        turnStatusEl.textContent = `Checkmate • ${winner} wins`;
        turnStatusEl.className = 'text-xs text-rose-400 font-semibold';
      } else if (game.in_draw() || game.in_stalemate() || game.in_threefold_repetition()) {
        turnStatusEl.textContent = 'Game Drawn';
        turnStatusEl.className = 'text-xs text-amber-400 font-semibold';
      } else {
        const sideText = turn === 'w' ? 'White to move' : 'Black to move';
        turnStatusEl.textContent = game.in_check() ? `${sideText} (Check!)` : sideText;
        turnStatusEl.className = game.in_check()
          ? 'text-xs text-rose-400 font-semibold'
          : 'text-xs text-emerald-400 font-medium';
      }

      // Move count badge
      moveCountBadge.textContent = `${history.length} ${history.length === 1 ? 'Move' : 'Moves'}`;

      // Move History Table
      if (history.length === 0) {
        emptyHistoryMsg.classList.remove('hidden');
        moveHistoryTable.classList.add('hidden');
        moveHistoryBody.innerHTML = '';
      } else {
        emptyHistoryMsg.classList.add('hidden');
        moveHistoryTable.classList.remove('hidden');
        moveHistoryBody.innerHTML = '';

        for (let i = 0; i < history.length; i += 2) {
          const moveNum = Math.floor(i / 2) + 1;
          const whiteMove = history[i];
          const blackMove = history[i + 1];

          const tr = document.createElement('tr');
          tr.className = 'border-b border-white/[0.03] hover:bg-white/[0.03]';

          const isLatestWhite = i === history.length - 1;
          const isLatestBlack = i + 1 === history.length - 1;

          tr.innerHTML = `
            <td class="py-1.5 pl-2 pr-1 text-neutral-500 w-10 select-none">${moveNum}.</td>
            <td class="py-1.5 px-2 font-medium ${isLatestWhite ? 'text-white bg-white/10 rounded-md' : 'text-neutral-200'}">${whiteMove.san}</td>
            <td class="py-1.5 px-2 font-medium ${blackMove ? (isLatestBlack ? 'text-white bg-white/10 rounded-md' : 'text-neutral-200') : 'text-neutral-600'}">${blackMove ? blackMove.san : ''}</td>
          `;
          moveHistoryBody.appendChild(tr);
        }

        // Auto-scroll to latest move
        moveHistoryContainer.scrollTop = moveHistoryContainer.scrollHeight;
      }

      // Captured pieces & material difference calculation
      const capturedByWhite = [];
      const capturedByBlack = [];
      let whiteScore = 0;
      let blackScore = 0;

      history.forEach((m) => {
        if (m.captured) {
          if (m.color === 'w') {
            capturedByWhite.push(m.captured);
            whiteScore += PIECE_VALUES[m.captured] || 0;
          } else {
            capturedByBlack.push(m.captured);
            blackScore += PIECE_VALUES[m.captured] || 0;
          }
        }
      });

      const sortOrder = { q: 1, r: 2, b: 3, n: 4, p: 5 };
      capturedByWhite.sort((a, b) => sortOrder[a] - sortOrder[b]);
      capturedByBlack.sort((a, b) => sortOrder[a] - sortOrder[b]);

      const topColor = flipped ? 'w' : 'b';
      const bottomColor = flipped ? 'b' : 'w';

      renderPlayerCard('top', topColor, topColor === 'w' ? capturedByWhite : capturedByBlack, whiteScore - blackScore, turn === topColor);
      renderPlayerCard('bottom', bottomColor, bottomColor === 'w' ? capturedByWhite : capturedByBlack, blackScore - whiteScore, turn === bottomColor);
    }

    function renderPlayerCard(position, color, capturedList, materialDiff, isActiveTurn) {
      const cardEl = document.getElementById(`${position}-player-card`);
      const avatarEl = document.getElementById(`${position}-avatar`);
      const nameEl = document.getElementById(`${position}-name`);
      const diffEl = document.getElementById(`${position}-material-diff`);
      const capEl = document.getElementById(`${position}-captured`);

      if (color === 'w') {
        avatarEl.textContent = 'W';
        avatarEl.className = 'w-9 h-9 rounded-xl bg-neutral-100 text-neutral-900 flex items-center justify-center font-bold text-sm shrink-0 shadow-xs';
        nameEl.textContent = 'White';
      } else {
        avatarEl.textContent = 'B';
        avatarEl.className = 'w-9 h-9 rounded-xl bg-neutral-800 border border-white/15 text-neutral-200 flex items-center justify-center font-bold text-sm shrink-0';
        nameEl.textContent = 'Black';
      }

      cardEl.classList.toggle('bg-[#2e2b27]', isActiveTurn && !game.game_over() && !gameResignedBy);

      diffEl.textContent = materialDiff > 0 ? `+${materialDiff}` : '';
      capEl.innerHTML = capturedList
        .map((p) => `<span class="text-xs text-neutral-400 leading-none">${MINI_PIECE_SYMBOLS[p] || ''}</span>`)
        .join('');

      // Sync clock display styling
      const clockEl = document.getElementById(`${position}-clock`);
      if (baseTimeSeconds > 0) {
        clockEl.classList.remove('hidden');
        const secs = color === 'w' ? whiteTime : blackTime;
        clockEl.textContent = formatTime(secs);
        clockEl.classList.toggle('text-white', isActiveTurn);
        clockEl.classList.toggle('border-emerald-500/50', isActiveTurn);
        clockEl.classList.toggle('text-neutral-400', !isActiveTurn);
        clockEl.classList.toggle('border-white/10', !isActiveTurn);
      } else {
        clockEl.classList.add('hidden');
      }
    }

    function formatTime(totalSeconds) {
      const s = Math.max(0, totalSeconds);
      const mins = Math.floor(s / 60);
      const secs = s % 60;
      return `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
    }

    function startClockFor(color) {
      stopClock();
      activeClockColor = color;
      clockInterval = setInterval(() => {
        if (activeClockColor === 'w') {
          whiteTime--;
          if (whiteTime <= 0) {
            whiteTime = 0;
            stopClock();
            showTimeoutModal('Black');
          }
        } else {
          blackTime--;
          if (blackTime <= 0) {
            blackTime = 0;
            stopClock();
            showTimeoutModal('White');
          }
        }
        updateSidebarUI();
      }, 1000);
    }

    function stopClock() {
      if (clockInterval) {
        clearInterval(clockInterval);
        clockInterval = null;
      }
    }

    function showGameOverModal() {
      const iconWrap = document.getElementById('gameover-icon-wrap');
      if (gameResignedBy) {
        const winner = gameResignedBy === 'w' ? 'Black' : 'White';
        const loser = gameResignedBy === 'w' ? 'White' : 'Black';
        iconWrap.className = 'w-12 h-12 rounded-full bg-rose-500/15 text-rose-400 flex items-center justify-center mx-auto mb-3';
        gameoverTitle.textContent = `${winner} Wins`;
        gameoverSubtitle.textContent = `${winner} Wins — ${loser} Resigned`;
      } else if (game.in_checkmate()) {
        const winner = game.turn() === 'w' ? 'Black' : 'White';
        iconWrap.className = 'w-12 h-12 rounded-full bg-emerald-500/15 text-emerald-400 flex items-center justify-center mx-auto mb-3';
        gameoverTitle.textContent = 'Checkmate!';
        gameoverSubtitle.textContent = `${winner} wins the match`;
      } else if (game.in_stalemate()) {
        iconWrap.className = 'w-12 h-12 rounded-full bg-amber-500/15 text-amber-400 flex items-center justify-center mx-auto mb-3';
        gameoverTitle.textContent = 'Stalemate';
        gameoverSubtitle.textContent = 'Game ends in a draw';
      } else if (game.in_threefold_repetition()) {
        iconWrap.className = 'w-12 h-12 rounded-full bg-amber-500/15 text-amber-400 flex items-center justify-center mx-auto mb-3';
        gameoverTitle.textContent = 'Draw by Repetition';
        gameoverSubtitle.textContent = 'Threefold repetition reached';
      } else if (game.insufficient_material()) {
        iconWrap.className = 'w-12 h-12 rounded-full bg-amber-500/15 text-amber-400 flex items-center justify-center mx-auto mb-3';
        gameoverTitle.textContent = 'Draw';
        gameoverSubtitle.textContent = 'Insufficient checkmating material';
      } else {
        iconWrap.className = 'w-12 h-12 rounded-full bg-amber-500/15 text-amber-400 flex items-center justify-center mx-auto mb-3';
        gameoverTitle.textContent = 'Draw';
        gameoverSubtitle.textContent = 'Game ended in a draw';
      }
      gameoverModal.classList.remove('hidden');
    }

    function showTimeoutModal(winner) {
      const iconWrap = document.getElementById('gameover-icon-wrap');
      iconWrap.className = 'w-12 h-12 rounded-full bg-amber-500/15 text-amber-400 flex items-center justify-center mx-auto mb-3';
      gameoverTitle.textContent = 'Time Out!';
      gameoverSubtitle.textContent = `${winner} wins on time`;
      gameoverModal.classList.remove('hidden');
    }

    function resignCurrentGame() {
      if (game.game_over() || gameResignedBy) return;
      gameResignedBy = game.turn();
      selectedSquare = null;
      legalMovesForSelected = [];
      pendingPromotion = null;
      promotionModal.classList.add('hidden');
      stopClock();
      sfx.playMove(false, true);
      renderBoard();
      updateSidebarUI();
      showGameOverModal();
    }

    /**
     * =========================================================================
     * 10. TOOLBAR CONTROLS & INITIALIZATION
     * =========================================================================
     */
    function resetGame() {
      stopClock();
      game.reset();
      selectedSquare = null;
      legalMovesForSelected = [];
      lastMove = null;
      pendingPromotion = null;
      gameResignedBy = null;
      // Always reset board orientation to White at the bottom for a new game
      flipped = false;
      promotionModal.classList.add('hidden');
      gameoverModal.classList.add('hidden');

      baseTimeSeconds = parseInt(document.getElementById('time-control-select').value, 10) || 0;
      whiteTime = baseTimeSeconds;
      blackTime = baseTimeSeconds;

      renderBoard();
      updateSidebarUI();
      engine.analyze(game);
    }

    document.getElementById('btn-new-game').addEventListener('click', resetGame);
    document.getElementById('modal-newgame-btn').addEventListener('click', resetGame);
    document.getElementById('btn-resign').addEventListener('click', resignCurrentGame);
    document.getElementById('modal-review-btn').addEventListener('click', () => {
      gameoverModal.classList.add('hidden');
    });

    document.getElementById('btn-undo').addEventListener('click', () => {
      if (gameResignedBy) {
        gameResignedBy = null;
        gameoverModal.classList.add('hidden');
        renderBoard();
        updateSidebarUI();
        return;
      }
      if (game.history().length === 0) return;
      game.undo();
      const hist = game.history({ verbose: true });
      lastMove = hist.length > 0 ? { from: hist[hist.length - 1].from, to: hist[hist.length - 1].to } : null;
      selectedSquare = null;
      legalMovesForSelected = [];
      if (autoFlip) {
        flipped = game.turn() === 'b';
      }
      gameoverModal.classList.add('hidden');
      promotionModal.classList.add('hidden');
      sfx.playMove(false, false);
      renderBoard();
      updateSidebarUI();
      engine.analyze(game);
    });

    const autoFlipBtn = document.getElementById('btn-auto-flip');
    autoFlipBtn.addEventListener('click', () => {
      autoFlip = !autoFlip;
      if (autoFlip) {
        autoFlipBtn.className = 'flex flex-col items-center justify-center py-2 px-1 rounded-xl bg-[#739552]/25 border border-[#739552]/60 hover:bg-[#739552]/35 active:scale-95 text-white transition';
        autoFlipBtn.querySelector('svg').classList.replace('text-neutral-400', 'text-[#95bb72]');
        autoFlipBtn.querySelector('span').classList.replace('font-medium', 'font-semibold');
        flipped = game.turn() === 'b';
        renderBoard();
        updateSidebarUI();
      } else {
        autoFlipBtn.className = 'flex flex-col items-center justify-center py-2 px-1 rounded-xl bg-[#2b2926] border border-transparent hover:bg-[#36332f] active:scale-95 text-neutral-300 transition';
        autoFlipBtn.querySelector('svg').classList.replace('text-[#95bb72]', 'text-neutral-400');
        autoFlipBtn.querySelector('span').classList.replace('font-semibold', 'font-medium');
      }
    });

    document.getElementById('btn-flip').addEventListener('click', () => {
      flipped = !flipped;
      renderBoard();
      updateSidebarUI();
    });

    document.getElementById('btn-sound').addEventListener('click', () => {
      sfx.muted = !sfx.muted;
      document.getElementById('icon-sound-on').classList.toggle('hidden', sfx.muted);
      document.getElementById('icon-sound-off').classList.toggle('hidden', !sfx.muted);
      document.getElementById('label-sound').textContent = sfx.muted ? 'Muted' : 'Sound';
    });

    document.getElementById('time-control-select').addEventListener('change', resetGame);

    // Boot immediately on DOM ready so the 8x8 board and pieces render with zero external dependencies
    function initBoardApp() {
      try {
        renderBoard();
        updateSidebarUI();
        engine.analyze(game);
      } catch (err) {
        console.error('Board initialization error:', err);
      }
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initBoardApp);
    } else {
      initBoardApp();
    }
  </script>
